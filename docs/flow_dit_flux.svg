<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">DiT 去噪路线</title>
  <desc id="desc">FLUX.1-dev Diffusion Transformer 与 PuLID-FLUX 条件下的三维人脸局部轨迹残差注入流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF9FF"/><stop offset="1" stop-color="#F4F9F8"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#31235C"/><stop offset="1" stop-color="#65449A"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#352656" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#73859B"/></marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#7559E8"/></marker>
    <marker id="tealArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#079B92"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif}.title{font-size:32px;font-weight:700;fill:#fff}.sub{font-size:15px;fill:#E0D8F0}.lane{font-size:12px;font-weight:700;letter-spacing:1.3px}.node{font-size:17px;font-weight:700;fill:#20213E}.copy{font-size:13px;fill:#6D718A}.tiny{font-size:11.5px;font-weight:500;fill:#6D718A}
    </style>
  </defs>
  <rect width="1500" height="760" fill="url(#bg)"/>
  <rect x="38" y="30" width="1424" height="105" rx="26" fill="url(#header)"/>
  <circle cx="88" cy="82" r="21" fill="#8B6CF0"/><path d="M77 82h22M88 71v22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="126" y="75" class="title">路线 B · DiT 去噪</text>
  <text x="127" y="106" class="sub">FLUX.1-dev Transformer + PuLID-FLUX · packed latent + 子位置级 3D residual</text>
  <rect x="1282" y="64" width="131" height="37" rx="18.5" fill="#fff" opacity=".14"/><text x="1315" y="88" style="font-size:13px;font-weight:700;fill:#fff">DiT 路线</text>

  <text x="70" y="177" class="lane" fill="#7559E8">MAIN DENOISING · 主去噪链</text>
  <rect x="55" y="190" width="1390" height="205" rx="24" fill="#F5F2FC" stroke="#D7CFEB" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="82" y="238" width="190" height="105" rx="18" fill="#fff"/>
    <rect x="325" y="228" width="220" height="125" rx="19" fill="#EEE9FF" stroke="#CCBFF2"/>
    <rect x="600" y="238" width="180" height="105" rx="18" fill="#fff" stroke="#D4CBE9"/>
    <rect x="835" y="218" width="260" height="145" rx="20" fill="#EEE9FF" stroke="#9078E8" stroke-width="2"/>
    <rect x="1150" y="238" width="170" height="105" rx="18" fill="#fff"/>
    <rect x="1370" y="248" width="70" height="85" rx="17" fill="#35275E"/>
  </g>
  <text x="108" y="269" class="node">初始噪声 zT</text><text x="108" y="294" class="copy">文本：T5 / CLIP</text><text x="108" y="317" class="copy">身份：PuLID</text>
  <line x1="272" y1="290" x2="322" y2="290" stroke="#73859B" stroke-width="2.7" marker-end="url(#arrow)"/>
  <text x="355" y="267" class="node">FLUX Transformer</text><text x="355" y="292" class="copy">packed latent 去噪</text><rect x="355" y="310" width="102" height="25" rx="12.5" fill="#DED5FF"/><text x="375" y="327" class="tiny">step 0–29</text>
  <line x1="545" y1="290" x2="597" y2="290" stroke="#73859B" stroke-width="2.7" marker-end="url(#arrow)"/>
  <text x="638" y="272" class="node">step-30</text><text x="628" y="299" class="copy">z30 / pred_x0</text><text x="636" y="321" class="tiny">轨迹分叉</text>
  <line x1="780" y1="290" x2="832" y2="290" stroke="#7559E8" stroke-width="3" marker-end="url(#purpleArrow)"/>
  <text x="869" y="256" class="node">FLUX Transformer</text><text x="869" y="282" class="copy">逐步接收通道级 3D 残差</text><rect x="869" y="300" width="150" height="26" rx="13" fill="#DED5FF"/><text x="887" y="318" class="tiny">step 30–T(h)</text>
  <circle cx="1047" cy="290" r="22" fill="#7559E8"/><text x="1037" y="298" style="font-size:24px;font-weight:700;fill:#fff">⊕</text>
  <line x1="1095" y1="290" x2="1147" y2="290" stroke="#73859B" stroke-width="2.7" marker-end="url(#arrow)"/>
  <text x="1185" y="272" class="node">AE Decode</text><text x="1188" y="299" class="copy">unpack → RGB</text><text x="1207" y="322" class="tiny">x0</text>
  <line x1="1320" y1="290" x2="1367" y2="290" stroke="#73859B" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M1390 272l10 10 18-22" fill="none" stroke="#8DF0E2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1385" y="315" style="font-size:11px;font-weight:700;fill:#fff">首帧</text>

  <text x="70" y="438" class="lane" fill="#079B92">3D IDENTITY BRANCH · 3D 身份支路</text>
  <rect x="55" y="450" width="1390" height="250" rx="24" fill="#EFF9F7" stroke="#B9DDD8" stroke-width="1.5"/>
  <path d="M690 343V415H185V507" fill="none" stroke="#079B92" stroke-width="3" marker-end="url(#tealArrow)"/><rect x="393" y="402" width="110" height="25" rx="12.5" fill="#DDF4F0"/><text x="410" y="419" class="tiny">pred_x0</text>
  <g filter="url(#shadow)">
    <rect x="90" y="510" width="190" height="105" rx="18" fill="#fff"/>
    <rect x="335" y="500" width="205" height="125" rx="19" fill="#fff" stroke="#C8E3DF"/>
    <rect x="595" y="500" width="210" height="125" rx="19" fill="#fff" stroke="#C8E3DF"/>
    <rect x="860" y="490" width="245" height="145" rx="20" fill="#E5F7F4" stroke="#76C9C0"/>
    <rect x="1160" y="490" width="235" height="145" rx="19" fill="#123D49"/>
  </g>
  <text x="119" y="542" class="node">目标脸分析</text><text x="119" y="568" class="copy">InsightFace</text><text x="119" y="592" class="copy">姿态 · bbox · 脸高 h</text>
  <line x1="280" y1="562" x2="332" y2="562" stroke="#079B92" stroke-width="2.7" marker-end="url(#tealArrow)"/>
  <text x="365" y="535" class="node">FaceLift 3D 渲染</text><text x="365" y="562" class="copy">Gaussian 身份资产</text><text x="365" y="586" class="copy">目标姿态 + 高 yaw 标定</text>
  <line x1="540" y1="562" x2="592" y2="562" stroke="#079B92" stroke-width="2.7" marker-end="url(#tealArrow)"/>
  <text x="626" y="535" class="node">纯 3D 参考构建</text><text x="626" y="562" class="copy">光照匹配 + BiSeNet mask</text><text x="626" y="586" class="copy">64×80 VAE soft mask</text>
  <line x1="805" y1="562" x2="857" y2="562" stroke="#079B92" stroke-width="2.7" marker-end="url(#tealArrow)"/>
  <text x="893" y="526" class="node">AE + 2×2 Packing</text><text x="893" y="552" class="copy">3D reference trajectory</text><text x="893" y="576" class="copy">mask 展开到 packed 通道</text><rect x="893" y="594" width="151" height="25" rx="12.5" fill="#D3F0EB"/><text x="909" y="611" class="tiny">reference z_ref,t</text>
  <line x1="1105" y1="562" x2="1157" y2="562" stroke="#079B92" stroke-width="2.7" marker-end="url(#tealArrow)"/>
  <text x="1191" y="526" style="font-size:17px;font-weight:700;fill:#fff">packed 残差注入</text><text x="1191" y="554" style="font-family:monospace;font-size:13px;font-weight:700;fill:#A7F3E6">Δz_t = M_4ch * (z_ref,t - z_t)</text><text x="1191" y="582" style="font-size:12px;fill:#C8E8E3">2×2 子位置分别保留 alpha</text><text x="1191" y="607" style="font-size:12px;fill:#C8E8E3">λ(h) · 自适应注入窗口</text>
  <path d="M1278 490V425H1047V315" fill="none" stroke="#079B92" stroke-width="3.2" marker-end="url(#tealArrow)"/>
  <rect x="1123" y="412" width="175" height="26" rx="13" fill="#0D8078"/><text x="1142" y="430" style="font-size:11.5px;font-weight:700;fill:#fff">same-timestep 注入</text>
  <text x="75" y="729" class="tiny">关键点：FLUX 使用 DiT/Transformer 主干；像素 mask 先映射到 VAE 子位置，再按 2×2 packing 展开到 packed token 通道，提升小脸注入粒度。</text>
</svg>
