<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">3D 引导的角色一致性扩散模型架构</title>
  <desc id="desc">以扩散去噪主干为中心，展示文本和身份条件、三维人脸参考轨迹、语义掩码及自适应残差注入。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="1" stop-color="#F3F8F8"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12243E"/>
      <stop offset="1" stop-color="#1D4161"/>
    </linearGradient>
    <linearGradient id="mainBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF1FF"/>
      <stop offset="1" stop-color="#F4F7FF"/>
    </linearGradient>
    <linearGradient id="refBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8FAF7"/>
      <stop offset="1" stop-color="#F3FCFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#15314A" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#71839A"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4C72E6"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#009F95"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7658E8"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .title { font-size:34px; font-weight:700; fill:#FFFFFF; }
      .sub { font-size:15px; font-weight:400; fill:#C7D5E5; }
      .zone { font-size:13px; font-weight:700; letter-spacing:1.4px; }
      .node { font-size:17px; font-weight:700; fill:#13263F; }
      .copy { font-size:13px; font-weight:400; fill:#687A90; }
      .tiny { font-size:11.5px; font-weight:500; fill:#687A90; }
      .tensor { font-family:"DejaVu Sans Mono", monospace; font-size:13px; font-weight:700; fill:#3E526B; }
      .white { fill:#FFFFFF; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="40" y="32" width="1520" height="108" rx="26" fill="url(#head)"/>
  <circle cx="88" cy="86" r="21" fill="#20C9B5"/>
  <path d="M79 87h18 M88 78v18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="125" y="80" class="title">3D 引导的角色一致性扩散模型</text>
  <text x="126" y="111" class="sub">3D-Guided Identity-Consistent Diffusion · 当前 v5 架构</text>
  <rect x="1328" y="67" width="182" height="38" rx="19" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="1352" cy="86" r="5.5" fill="#5EEAD4"/>
  <text x="1367" y="91" style="font-size:13px;font-weight:700;fill:#FFFFFF">单人物已验证</text>

  <!-- Conditioning zone -->
  <rect x="65" y="170" width="1470" height="145" rx="22" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="1.4" stroke-dasharray="7 7"/>
  <text x="90" y="198" class="zone" fill="#7658E8">CONDITIONING · 条件输入</text>

  <g filter="url(#shadow)">
    <rect x="105" y="220" width="190" height="66" rx="16" fill="#F5F1FF"/>
    <rect x="390" y="220" width="210" height="66" rx="16" fill="#F5F1FF"/>
    <rect x="720" y="220" width="190" height="66" rx="16" fill="#ECF2FF"/>
    <rect x="1005" y="220" width="240" height="66" rx="16" fill="#ECF2FF"/>
  </g>
  <circle cx="137" cy="253" r="14" fill="#7658E8"/>
  <path d="M130 249h14 M130 254h10 M130 259h12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="160" y="249" class="node">文本 Prompt</text>
  <text x="160" y="271" class="copy">场景与镜头语义</text>
  <line x1="295" y1="253" x2="387" y2="253" stroke="#7658E8" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="420" y="249" class="node">Text Encoder</text>
  <text x="420" y="271" class="copy">CLIP / T5 embeddings</text>

  <circle cx="752" cy="253" r="14" fill="#4C72E6"/>
  <path d="M746 251a6 6 0 1 1 12 0 M743 264c1-6 17-6 18 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="775" y="249" class="node">身份照片</text>
  <text x="775" y="271" class="copy">原始人物参考</text>
  <line x1="910" y1="253" x2="1002" y2="253" stroke="#4C72E6" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1035" y="249" class="node">Identity Encoder</text>
  <text x="1035" y="271" class="copy">PuLID / IP-Adapter</text>

  <path d="M495 286 V337 H734" fill="none" stroke="#7658E8" stroke-width="2.3" marker-end="url(#arrowPurple)"/>
  <path d="M1125 286 V337 H866" fill="none" stroke="#4C72E6" stroke-width="2.3" marker-end="url(#arrowBlue)"/>
  <rect x="734" y="320" width="132" height="35" rx="17.5" fill="#243C5A"/>
  <text x="755" y="343" style="font-size:13px;font-weight:700;fill:#FFFFFF">条件特征 c</text>

  <!-- Diffusion backbone zone -->
  <rect x="65" y="346" width="1470" height="225" rx="24" fill="#F5F8FD" stroke="#C8D7EA" stroke-width="1.5"/>
  <text x="90" y="380" class="zone" fill="#4C72E6">DIFFUSION BACKBONE · 去噪主干</text>

  <g filter="url(#shadow)">
    <rect x="105" y="415" width="150" height="94" rx="18" fill="#FFFFFF"/>
    <rect x="330" y="405" width="245" height="114" rx="19" fill="url(#mainBlock)" stroke="#BFD0F2"/>
    <rect x="650" y="405" width="240" height="114" rx="19" fill="#FFFFFF" stroke="#C8D7EA"/>
    <rect x="965" y="395" width="300" height="134" rx="20" fill="url(#mainBlock)" stroke="#7F9FEF" stroke-width="2"/>
    <rect x="1340" y="415" width="150" height="94" rx="18" fill="#FFFFFF"/>
  </g>

  <text x="158" y="451" class="tensor">z_T</text>
  <text x="130" y="480" class="node">高斯噪声</text>
  <text x="132" y="501" class="copy">初始 latent</text>
  <line x1="255" y1="462" x2="327" y2="462" stroke="#71839A" stroke-width="2.8" marker-end="url(#arrow)"/>

  <text x="365" y="447" class="node">Diffusion Transformer</text>
  <text x="365" y="473" class="copy">基础去噪阶段</text>
  <rect x="365" y="487" width="110" height="25" rx="12.5" fill="#DCE7FF"/>
  <text x="384" y="504" class="tiny">step 0–29</text>
  <path d="M800 355 V389 H452 V402" fill="none" stroke="#526984" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="575" y1="462" x2="647" y2="462" stroke="#71839A" stroke-width="2.8" marker-end="url(#arrow)"/>
  <text x="700" y="444" class="tensor">z_30</text>
  <text x="694" y="475" class="node">step-30 分叉点</text>
  <text x="690" y="499" class="copy">估计 pred_x0</text>

  <line x1="890" y1="462" x2="962" y2="462" stroke="#4C72E6" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1001" y="438" class="node">Diffusion Transformer</text>
  <text x="1001" y="465" class="copy">带局部 3D 残差的后段去噪</text>
  <rect x="1001" y="483" width="104" height="26" rx="13" fill="#DCE7FF"/>
  <text x="1019" y="501" class="tiny">step 30–49</text>
  <circle cx="1208" cy="462" r="22" fill="#4C72E6"/>
  <text x="1198" y="470" style="font-size:24px;font-weight:700;fill:#FFFFFF">⊕</text>
  <path d="M800 355 V373 H1115 V392" fill="none" stroke="#526984" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1265" y1="462" x2="1337" y2="462" stroke="#71839A" stroke-width="2.8" marker-end="url(#arrow)"/>
  <text x="1374" y="450" class="node">AE / VAE</text>
  <text x="1372" y="475" class="copy">Decoder</text>
  <text x="1387" y="499" class="tensor">x_0</text>

  <!-- branch from step 30 -->
  <path d="M770 519 V604" fill="none" stroke="#009F95" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <rect x="708" y="541" width="124" height="26" rx="13" fill="#DDF5F1"/>
  <text x="729" y="559" class="tiny">online branch</text>

  <!-- 3D reference branch -->
  <rect x="65" y="600" width="1470" height="298" rx="24" fill="#F1FAF8" stroke="#B8DDD8" stroke-width="1.5"/>
  <text x="90" y="635" class="zone" fill="#009F95">3D REFERENCE BRANCH · 参考轨迹分支</text>

  <!-- offline 3D asset -->
  <rect x="95" y="665" width="184" height="82" rx="17" fill="#FFFFFF" stroke="#CBE5E1"/>
  <text x="118" y="696" class="node">身份照片</text>
  <text x="118" y="721" class="copy">离线一次建模</text>
  <line x1="279" y1="706" x2="330" y2="706" stroke="#009F95" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <rect x="333" y="665" width="192" height="82" rx="17" fill="#FFFFFF" stroke="#CBE5E1"/>
  <text x="361" y="696" class="node">FaceLift</text>
  <text x="361" y="721" class="copy">3D Gaussian</text>

  <!-- pose path -->
  <rect x="620" y="650" width="225" height="112" rx="18" fill="#FFFFFF" stroke="#CBE5E1"/>
  <text x="650" y="682" class="node">InsightFace</text>
  <text x="650" y="707" class="copy">pose · bbox · face height</text>
  <rect x="650" y="722" width="142" height="24" rx="12" fill="#E4F6F3"/>
  <text x="665" y="739" class="tiny">pred_x0 分析</text>
  <path d="M770 604 V632 H732 V647" fill="none" stroke="#009F95" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <rect x="890" y="650" width="230" height="112" rx="18" fill="#FFFFFF" stroke="#CBE5E1"/>
  <text x="920" y="682" class="node">Pose-aware Renderer</text>
  <text x="920" y="707" class="copy">连续姿态 3D 渲染</text>
  <rect x="920" y="722" width="155" height="24" rx="12" fill="#FFF0E3"/>
  <text x="935" y="739" class="tiny">高 yaw 标定补偿</text>
  <line x1="845" y1="706" x2="887" y2="706" stroke="#009F95" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M525 706 H562 V780 H860 V706 H887" fill="none" stroke="#009F95" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrowTeal)"/>
  <rect x="575" y="766" width="82" height="23" rx="11.5" fill="#DDF5F1"/>
  <text x="590" y="782" class="tiny">Gaussian</text>

  <!-- reference construction -->
  <rect x="1165" y="634" width="320" height="144" rx="19" fill="url(#refBlock)" stroke="#69C7BC" stroke-width="1.6"/>
  <text x="1195" y="668" class="node">3D Reference Builder</text>
  <text x="1195" y="694" class="copy">低频 log-RGB 光照匹配</text>
  <text x="1195" y="718" class="copy">BiSeNet target ∩ reference</text>
  <rect x="1195" y="736" width="164" height="25" rx="12.5" fill="#DDF5F1"/>
  <text x="1210" y="753" class="tiny">保守 inner-face mask</text>
  <line x1="1120" y1="706" x2="1162" y2="706" stroke="#009F95" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M770 604 V620 H1324 V631" fill="none" stroke="#8AA39F" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <!-- bottom residual math -->
  <rect x="335" y="800" width="250" height="66" rx="16" fill="#FFFFFF" stroke="#CBE5E1"/>
  <text x="365" y="827" class="node">AE / VAE Encoder</text>
  <text x="365" y="850" class="copy">3D reference latent</text>
  <path d="M1325 778 V832 H588" fill="none" stroke="#009F95" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <rect x="660" y="791" width="310" height="84" rx="17" fill="#103B48"/>
  <text x="692" y="823" style="font-size:17px;font-weight:700;fill:#FFFFFF">Same-timestep Residual</text>
  <text x="692" y="851" style="font-family:'DejaVu Sans Mono',monospace;font-size:13px;font-weight:700;fill:#A7F3E6">Δ_t = M ⊙ (z_ref,t − z_t)</text>
  <line x1="585" y1="833" x2="657" y2="833" stroke="#009F95" stroke-width="2.8" marker-end="url(#arrowTeal)"/>

  <rect x="1030" y="800" width="270" height="66" rx="16" fill="#FFFFFF" stroke="#CBE5E1"/>
  <text x="1058" y="827" class="node">Adaptive Controller</text>
  <text x="1058" y="850" class="copy">λ(h) · 注入结束步 T(h)</text>
  <path d="M780 762 V780 H1165 V797" fill="none" stroke="#71839A" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <line x1="1030" y1="833" x2="973" y2="833" stroke="#009F95" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- residual injection to backbone -->
  <path d="M815 791 V760 H1510 V550 H1208 V487" fill="none" stroke="#009F95" stroke-width="3.3" marker-end="url(#arrowTeal)"/>
  <rect x="1310" y="537" width="170" height="27" rx="13.5" fill="#0F766E"/>
  <text x="1330" y="556" style="font-size:11.5px;font-weight:700;fill:#FFFFFF">M · λ(h) 局部注入</text>

  <!-- Footer legend -->
  <rect x="65" y="920" width="1470" height="50" rx="18" fill="#FFFFFF"/>
  <text x="91" y="951" class="tiny">实现分支</text>
  <circle cx="180" cy="945" r="6" fill="#4C72E6"/>
  <text x="195" y="951" class="copy">PuLID-FLUX：packed latent 子位置 mask</text>
  <circle cx="540" cy="945" r="6" fill="#7658E8"/>
  <text x="555" y="951" class="copy">IP-Adapter / SDXL：全局身份条件 + 局部 3D residual</text>
  <circle cx="1055" cy="945" r="6" fill="#009F95"/>
  <text x="1070" y="951" class="copy">正常脸 0.4 / 20 步；小脸自适应降强度、缩窗口</text>
</svg>
