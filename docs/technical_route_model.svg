  <!-- Connector from first frame into core module -->
  <path d="M1390 394 V465 H1470" fill="none" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrowTeal)"/>

  <!-- Core module -->
  <rect x="48" y="458" width="1504" height="454" rx="30" fill="url(#coreBg)" stroke="#D7E8E8" stroke-width="1.5"/>
  <text x="82" y="500" class="section-no">02 · IDENTITY CONSISTENCY CORE</text>
  <text x="82" y="534" class="section-title">3D 人脸一致性注入（当前重点）</text>
  <rect x="1281" y="486" width="214" height="36" rx="18" fill="#0F766E"/>
  <circle cx="1305" cy="504" r="5" fill="#5EEAD4"/>
  <text x="1320" y="509" class="pill">单人物已验证</text>

  <!-- Core arrows -->
  <line x1="334" y1="674" x2="371" y2="674" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <line x1="624" y1="674" x2="661" y2="674" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <line x1="914" y1="674" x2="951" y2="674" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <line x1="1204" y1="674" x2="1241" y2="674" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrowTeal)"/>

  <!-- Core 1 -->
  <g filter="url(#softShadow)">
    <rect x="78" y="572" width="256" height="204" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="78" y="572" width="256" height="7" rx="3.5" fill="#4D78E8"/>
  <circle cx="112" cy="616" r="18" fill="#E9F0FF"/>
  <path d="M104 616a8 8 0 1 0 16 0a8 8 0 1 0-16 0 M118 622l6 6" fill="none" stroke="#4D78E8" stroke-width="2.4" stroke-linecap="round"/>
  <text x="142" y="622" class="core-title">检测目标脸</text>
  <text x="100" y="662" class="core-copy">step-30 估计 pred_x0</text>
  <text x="100" y="686" class="core-copy">InsightFace 检测</text>
  <rect x="100" y="711" width="112" height="28" rx="14" fill="#EEF3FC"/>
  <text x="116" y="730" class="tiny">姿态 · 尺寸</text>

  <!-- Core 2 -->
  <g filter="url(#softShadow)">
    <rect x="368" y="572" width="256" height="204" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="368" y="572" width="256" height="7" rx="3.5" fill="#FF9E4A"/>
  <circle cx="402" cy="616" r="18" fill="#FFF1E4"/>
  <path d="M394 620l8-15 8 15-8 7z M402 605v22" fill="none" stroke="#E57F25" stroke-width="2.3" stroke-linejoin="round"/>
  <text x="432" y="622" class="core-title">连续 3D 渲染</text>
  <text x="390" y="662" class="core-copy">FaceLift Gaussian</text>
  <text x="390" y="686" class="core-copy">按目标姿态生成参考脸</text>
  <rect x="390" y="711" width="151" height="28" rx="14" fill="#FFF3E8"/>
  <text x="405" y="730" class="tiny">高 yaw 自动标定</text>

  <!-- Core 3 -->
  <g filter="url(#softShadow)">
    <rect x="658" y="572" width="256" height="204" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="658" y="572" width="256" height="7" rx="3.5" fill="#7159E8"/>
  <circle cx="692" cy="616" r="18" fill="#F0EDFF"/>
  <circle cx="688" cy="614" r="6" fill="none" stroke="#7159E8" stroke-width="2"/>
  <circle cx="697" cy="620" r="6" fill="none" stroke="#7159E8" stroke-width="2"/>
  <text x="722" y="622" class="core-title">构建局部参考</text>
  <text x="680" y="662" class="core-copy">纯 3D 光照 / 色调匹配</text>
  <text x="680" y="686" class="core-copy">BiSeNet 保守语义核心</text>
  <rect x="680" y="711" width="136" height="28" rx="14" fill="#F2EFFF"/>
  <text x="696" y="730" class="tiny">不混入目标像素</text>

  <!-- Core 4 -->
  <g filter="url(#softShadow)">
    <rect x="948" y="572" width="256" height="204" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="948" y="572" width="256" height="7" rx="3.5" fill="#00A6A6"/>
  <circle cx="982" cy="616" r="18" fill="#E5F9F6"/>
  <path d="M974 621h16 M977 616h10 M980 611h4" fill="none" stroke="#008D89" stroke-width="2.4" stroke-linecap="round"/>
  <text x="1012" y="622" class="core-title">自适应轨迹注入</text>
  <text x="970" y="662" class="core-copy">same-timestep residual</text>
  <text x="970" y="686" class="core-copy">按脸尺寸调强度与步数</text>
  <rect x="970" y="711" width="150" height="28" rx="14" fill="#E8F8F6"/>
  <text x="986" y="730" class="tiny">FLUX 子位置 mask</text>

  <!-- Core 5 -->
  <g filter="url(#softShadow)">
    <rect x="1238" y="572" width="284" height="204" rx="22" fill="#10233F"/>
  </g>
  <rect x="1238" y="572" width="284" height="7" rx="3.5" fill="#40E0C3"/>
  <circle cx="1272" cy="616" r="18" fill="#294562"/>
  <path d="M1264 617l6 6 11-14" fill="none" stroke="#5EEAD4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1302" y="622" style="font-size:17px;font-weight:700;fill:#FFFFFF">一致性首帧</text>
  <text x="1260" y="662" style="font-size:13px;fill:#C7D6E7">身份更稳 · 姿态匹配</text>
  <text x="1260" y="686" style="font-size:13px;fill:#C7D6E7">边界自然 · 小脸可控</text>
  <rect x="1260" y="711" width="224" height="28" rx="14" fill="#294562"/>
  <text x="1278" y="730" style="font-size:12px;font-weight:500;fill:#B8F2E6">输出到后续镜头 / 视频阶段</text>

  <!-- Model lanes -->
  <rect x="78" y="806" width="1444" height="72" rx="20" fill="#FFFFFF" opacity="0.88"/>
  <text x="106" y="838" class="tiny">双路线验证</text>
  <rect x="202" y="820" width="151" height="38" rx="19" fill="#EEF3FC"/>
  <circle cx="225" cy="839" r="6" fill="#4D78E8"/>
  <text x="241" y="844" class="core-copy">PuLID-FLUX</text>
  <rect x="367" y="820" width="205" height="38" rx="19" fill="#F2EFFF"/>
  <circle cx="390" cy="839" r="6" fill="#7159E8"/>
  <text x="406" y="844" class="core-copy">IP-Adapter / SDXL</text>
  <line x1="612" y1="820" x2="612" y2="858" stroke="#DDE5EE"/>
  <text x="642" y="838" class="tiny">自适应策略</text>
  <text x="738" y="838" class="core-copy">正常脸 0.4 / 20 步 · 小脸自动降强度、提前结束</text>
  <rect x="1267" y="820" width="225" height="38" rx="19" fill="#FFF4E8"/>
  <circle cx="1290" cy="839" r="6" fill="#FF9E4A"/>
  <text x="1306" y="844" class="core-copy">多人物：下一阶段</text>

  <!-- Footer -->
  <text x="78" y="964" class="tiny">核心目标：让同一角色跨角度、跨景别、跨镜头保持稳定身份，同时尽量保留生成模型的光照与画面自然度。</text>
  <text x="78" y="991" style="font-size:11px;font-weight:500;fill:#91A2B7;letter-spacing:.5px">MULTISHOT · TECHNICAL ROUTE · 2026</text>
</svg>
