  <g filter="url(#shadow)">
    <rect x="658" y="246" width="260" height="148" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="697" cy="284" r="19" fill="#00A6A6"/>
  <rect x="688" y="275" width="18" height="18" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="694" cy="281" r="2" fill="#FFFFFF"/>
  <path d="M690 290 l5-5 4 4 3-3 4 4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <rect x="855" y="264" width="44" height="24" rx="12" fill="#00A6A6"/>
  <text x="866" y="281" class="card-step">03</text>
  <text x="680" y="331" class="card-title">资产生成</text>
  <text x="680" y="360" class="card-copy">MCP 调用生成模型</text>
  <text x="680" y="381" class="card-copy">场景图 · 人物参考图</text>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="948" y="246" width="260" height="148" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="987" cy="284" r="19" fill="#FF9E4A"/>
  <path d="M978 288 l9-14 9 14 -9 6z M987 274v20 M978 288l18 0" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linejoin="round"/>
  <rect x="1145" y="264" width="44" height="24" rx="12" fill="#FF9E4A"/>
  <text x="1156" y="281" class="card-step">04</text>
  <text x="970" y="331" class="card-title">3D 人脸建模</text>
  <text x="970" y="360" class="card-copy">FaceLift 单图建模</text>
  <text x="970" y="381" class="card-copy">生成 Gaussian 资产</text>

  <!-- Card 5 -->
  <g filter="url(#shadow)">
    <rect x="1238" y="246" width="284" height="148" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="1277" cy="284" r="19" fill="#E85C7A"/>
  <rect x="1268" y="276" width="18" height="16" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M1273 276v-4h8v4 M1271 288l4-4 3 3 3-3 3 4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <rect x="1459" y="264" width="44" height="24" rx="12" fill="#E85C7A"/>
  <text x="1470" y="281" class="card-step">05</text>
  <text x="1260" y="331" class="card-title">镜头首帧生成</text>
  <text x="1260" y="360" class="card-copy">Diffusion 逐镜头生成</text>
  <text x="1260" y="381" class="card-copy">注入 3D 身份先验</text>

  <!-- Shared memory rail -->
  <path d="M718 417 H1390" fill="none" stroke="#C2CFDD" stroke-width="2" stroke-dasharray="5 7"/>
  <path d="M788 394 V417 M1078 394 V417 M1390 394 V417" fill="none" stroke="#C2CFDD" stroke-width="2"/>
  <rect x="822" y="404" width="310" height="31" rx="15.5" fill="#E8EFF7"/>
  <circle cx="846" cy="419.5" r="5" fill="#4D78E8"/>
