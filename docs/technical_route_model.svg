<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">多镜头角色一致性生成：当前技术路线</title>
  <desc id="desc">从故事输入、剧本规划、资产生成、三维人脸建模到镜头首帧生成，并展开三维人脸一致性注入模块。</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#F2F7F8"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233F"/>
      <stop offset="1" stop-color="#203D63"/>
    </linearGradient>
    <linearGradient id="coreBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F7FF"/>
      <stop offset="1" stop-color="#F1FBF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17324D" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324D" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#91A2B7"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00A6A6"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "WenQuanYi Micro Hei", sans-serif; }
      .title { font-size: 36px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #C7D6E7; letter-spacing: .4px; }
      .section-no { font-size: 13px; font-weight: 700; fill: #00A6A6; letter-spacing: 1.5px; }
      .section-title { font-size: 21px; font-weight: 700; fill: #10233F; }
      .card-step { font-size: 12px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .card-title { font-size: 20px; font-weight: 700; fill: #10233F; }
      .card-copy { font-size: 14px; font-weight: 400; fill: #65758B; }
      .core-title { font-size: 17px; font-weight: 700; fill: #10233F; }
      .core-copy { font-size: 13px; font-weight: 400; fill: #65758B; }
      .tiny { font-size: 12px; font-weight: 500; fill: #65758B; }
      .pill { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#pageBg)"/>
  <circle cx="1492" cy="94" r="185" fill="#5B77FF" opacity="0.055"/>
  <circle cx="103" cy="1010" r="230" fill="#00A6A6" opacity="0.045"/>

  <!-- Header -->
  <rect x="48" y="38" width="1504" height="112" rx="28" fill="url(#hero)"/>
  <circle cx="96" cy="94" r="21" fill="#00C7B7"/>
  <path d="M86 97 L94 105 L108 84" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="87" class="title">多镜头角色一致性生成 · 当前技术路线</text>
  <text x="133" y="119" class="subtitle">LangGraph 编排 · Qwen 规划 · MCP 工具 · 3D 人脸引导 · Diffusion 生成</text>
  <rect x="1307" y="72" width="194" height="40" rx="20" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="1332" cy="92" r="6" fill="#40E0C3"/>
  <text x="1348" y="97" class="pill">当前方案 v5</text>

  <!-- Main pipeline -->
  <text x="78" y="195" class="section-no">01 · GENERATION PIPELINE</text>
  <text x="78" y="225" class="section-title">生成主链</text>

  <!-- arrows behind cards -->
  <line x1="338" y1="320" x2="370" y2="320" stroke="#91A2B7" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="628" y1="320" x2="660" y2="320" stroke="#91A2B7" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="918" y1="320" x2="950" y2="320" stroke="#91A2B7" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1208" y1="320" x2="1240" y2="320" stroke="#91A2B7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="78" y="246" width="260" height="148" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="117" cy="284" r="19" fill="#4D78E8"/>
  <path d="M108 276 h18 v16 h-12 l-6 5z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="275" y="264" width="44" height="24" rx="12" fill="#4D78E8"/>
  <text x="286" y="281" class="card-step">01</text>
  <text x="100" y="331" class="card-title">故事输入</text>
  <text x="100" y="360" class="card-copy">自然语言剧情</text>
  <text x="100" y="381" class="card-copy">保存原始故事</text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="368" y="246" width="260" height="148" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="407" cy="284" r="19" fill="#7159E8"/>
  <path d="M399 275 h16 l4 4 v14 h-20z M403 281h12 M403 286h9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <rect x="565" y="264" width="44" height="24" rx="12" fill="#7159E8"/>
  <text x="576" y="281" class="card-step">02</text>
  <text x="390" y="331" class="card-title">剧本规划</text>
  <text x="390" y="360" class="card-copy">Qwen 结构化拆解</text>
  <text x="390" y="381" class="card-copy">人物 · 场景 · 镜头</text>

